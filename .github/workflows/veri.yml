name: Veri güncelle
on:
  schedule:
    - cron: "30 15 * * 1-5"   # hafta içi 18:30 (İstanbul)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fetch_data.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data
          git commit -m "veri güncelle" || exit 0
          git push
