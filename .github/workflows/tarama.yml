name: BIST AI Pro Tarama

on:
  schedule:
    # 4 saatlik mumların kapandığı saatlerin hemen ardından çalışır (TR = UTC+3)
    - cron: "5 11 * * 1-5"   # 14:05 TR (ilk 4 saatlik mum -10:00-14:00- kapanışı)
    - cron: "5 15 * * 1-5"   # 18:05 TR (ikinci 4 saatlik mum -14:00-18:00- kapanışı)
  workflow_dispatch: {}       # "Run workflow" butonuyla elle de tetiklenebilir

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        working-directory: src
        run: python main.py

      - name: Sonuçları commit et
        run: |
          git config user.name "bist-ai-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/sonuc.json docs/data/portfoy.json
          git diff --cached --quiet || git commit -m "Tarama güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
